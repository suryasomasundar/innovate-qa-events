name: Supabase Keep Alive

on:
  schedule:
    # Run once daily at 15:17 UTC. The offset avoids the busiest
    # start-of-hour window for scheduled GitHub Actions workflows.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-health-check:
    name: Query the recordings database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify database secret is configured
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL is not configured in repository secrets."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run database health query
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGCONNECT_TIMEOUT: "15"
          PGSSLMODE: require
        run: |
          # `pgbouncer=true` is understood by app database clients, but not psql.
          PSQL_DATABASE_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command "select 1 as health_check;"
